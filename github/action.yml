name: "openvibe GitHub Action"
description: "Run openvibe in GitHub Actions workflows"
branding:
  icon: "code"
  color: "orange"

inputs:
  model:
    description: "Model to use"
    required: true

  agent:
    description: "Agent to use. Must be a primary agent. Falls back to default_agent from config or 'build' if not found."
    required: false

  share:
    description: "Deprecated and ignored: session sharing was discontinued"
    required: false

  prompt:
    description: "Custom prompt to override the default prompt"
    required: false

  use_github_token:
    description: "Use GITHUB_TOKEN directly. App token exchange has been removed."
    required: false
    default: "true"

  mentions:
    description: "Comma-separated list of trigger phrases (case-insensitive). Defaults to '/openvibe,/oc'"
    required: false

  variant:
    description: "Model variant for provider-specific reasoning effort (e.g., high, max, minimal)"
    required: false

runs:
  using: "composite"
  steps:
    - name: Get openvibe version
      id: version
      shell: bash
      run: |
        echo "version=latest" >> $GITHUB_OUTPUT

    - name: Cache openvibe
      id: cache
      uses: actions/cache@v4
      with:
        path: ~/.openvibe/bin
        key: openvibe-${{ runner.os }}-${{ runner.arch }}-${{ steps.version.outputs.version }}

    - name: Install openvibe
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: echo "Install OpenVibe CLI on PATH before using this action" >&2 && exit 1

    - name: Add openvibe to PATH
      shell: bash
      run: echo "$HOME/.openvibe/bin" >> $GITHUB_PATH

    - name: Run openvibe
      shell: bash
      id: run_openvibe
      run: openvibe github run
      env:
        MODEL: ${{ inputs.model }}
        AGENT: ${{ inputs.agent }}
        PROMPT: ${{ inputs.prompt }}
        USE_GITHUB_TOKEN: ${{ inputs.use_github_token }}
        MENTIONS: ${{ inputs.mentions }}
        VARIANT: ${{ inputs.variant }}
